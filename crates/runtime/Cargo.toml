[package]
name = "band-runtime"
version.workspace = true
edition.workspace = true
publish.workspace = true
license.workspace = true

[target.'cfg(unix)'.dependencies]
portable-pty = "=0.9.0"
# Unix process-group termination for explicit session stop.
libc = "0.2"
# Session service catalog and protocol; preserve_order keeps saved key order.
serde_json = { version = "1", features = ["preserve_order"] }

[[bin]]
name = "band-session"
path = "src/main.rs"
